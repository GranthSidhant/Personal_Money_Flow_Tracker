{% extends "base.html" %}

{% block title %}Access Forbidden{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-danger mb-3">403</div>
    <h2 class="h3 fw-bold mb-2">Access Denied</h2>
    <p class="text-muted mb-4">You do not have permission to access this resource.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-gradient px-4 py-2">
        <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
