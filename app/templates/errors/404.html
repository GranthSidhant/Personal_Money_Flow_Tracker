{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-muted mb-3">404</div>
    <h2 class="h3 fw-bold mb-2">Page Not Found</h2>
    <p class="text-muted mb-4">The page you are looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-gradient px-4 py-2">
        <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
